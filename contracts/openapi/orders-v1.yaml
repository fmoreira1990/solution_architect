openapi: 3.1.0

info:
  title: Pedidos — API v1 (legado, em deprecação)
  version: 1.2.0
  description: |
    Contrato dos consumidores **atuais**. Preserva a semântica original:
    `201 Created` significa **venda confirmada**.

    ## Por que esta versão continua existindo

    A ADR-0007 mudou o núcleo para aceitação assíncrona. Isso é quebra
    **semântica** sob schema compatível: o JSON não muda, mas o significado
    do `201` sim. `CTX-10` exige compatibilidade por ≥ 6 meses e `CTX-12`
    proíbe interromper consumidores atuais.

    A v1 é, portanto, uma **fachada síncrona sobre o núcleo assíncrono**
    (ADR-0004): ela aceita o pedido, aguarda a validação e só então responde.
    Consumidores legados não percebem mudança alguma.

    ## Custo declarado desta fachada

    Ela **reintroduz** o acoplamento que a ADR-0007 eliminou — latência e
    disponibilidade desta versão dependem das validações. É consciente,
    minoritário e temporário. A disponibilidade precisa ser reportada
    **segmentada por versão**, não diluída na média.

    ## Deprecação

    Débito com data de vencimento: a fachada morre junto com a v1 ao fim da
    janela de compatibilidade. Respostas carregam `Deprecation` e `Sunset`
    (RFC 8594). **Migre para v2** — e trate os estados ao migrar.

servers:
  - url: https://api.exemplo.com.br
    description: Produção
  - url: http://127.0.0.1:8000
    description: Fatia executável local

tags:
  - name: pedidos

paths:
  /v1/orders:
    post:
      tags: [pedidos]
      summary: Cria um pedido (síncrono — devolve venda confirmada)
      operationId: criarPedidoV1
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOpcional'
        - $ref: '#/components/parameters/Chamador'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovoPedido' }
      responses:
        '201':
          description: |
            Pedido **confirmado**. `status` = `CONFIRMADO`.

            É esta garantia que o teste de compatibilidade exercita: um
            consumidor de referência que emite nota fiscal na resposta do POST
            precisa continuar passando com a v2 no ar.
          headers:
            Deprecation: { schema: { type: string } }
            Sunset: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '200':
          description: Replay — a chave já havia sido usada com o mesmo payload.
          headers:
            Idempotency-Replayed:
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '409':
          description: A mesma chave já foi usada com um payload diferente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '422':
          description: Oferta expirada, adulterada ou ausente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /v1/orders/{pedidoId}:
    get:
      tags: [pedidos]
      summary: Consulta um pedido
      operationId: consultarPedidoV1
      deprecated: true
      parameters:
        - name: pedidoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Pedido encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '404':
          description: Pedido inexistente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

components:
  parameters:
    IdempotencyKeyOpcional:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        **Opcional nesta versão, de propósito.** Torná-la obrigatória seria
        breaking change pela lista fechada da ADR-0004 ("tornar obrigatório um
        campo que era opcional na requisição").

        Sem a chave, o comportamento é o atual — sem proteção contra retry
        duplicado. Com a chave, o pedido passa a ser idempotente. Não
        pioramos, não quebramos, e oferecemos a saída.
      schema: { type: string, format: uuid }
    Chamador:
      name: X-Chamador
      in: header
      required: false
      schema: { type: string, default: legado }

  schemas:
    NovoPedido:
      type: object
      required: [cliente_id, oferta]
      properties:
        cliente_id: { type: string }
        canal:
          type: string
          enum: [web, app, parceiro]
          default: web
        oferta: { $ref: '#/components/schemas/Oferta' }

    Oferta:
      type: object
      required: [itens, catalogo_versao, expira_em, assinatura]
      properties:
        itens:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ItemOfertado' }
        catalogo_versao: { type: string }
        expira_em: { type: number }
        assinatura: { type: string }

    ItemOfertado:
      type: object
      required: [sku, quantidade, descricao, preco_unitario, moeda, unidade, peso_gramas]
      properties:
        sku: { type: string }
        quantidade: { type: number }
        descricao: { type: string }
        preco_unitario: { type: integer, description: Em centavos. }
        moeda: { type: string }
        unidade: { type: string }
        peso_gramas: { type: integer }
        promocao_id: { type: [string, 'null'] }

    Pedido:
      type: object
      required: [id, cliente_id, canal, status, criado_em, itens]
      properties:
        id: { type: string, format: uuid }
        cliente_id: { type: string }
        canal: { type: string }
        status:
          type: string
          enum: [CONFIRMADO, REJEITADO]
          description: |
            **Diferença semântica em relação à v2.** Aqui o POST só responde
            após o desfecho, então `RECEBIDO` nunca é devolvido por esta
            versão. Em v2, `RECEBIDO` é a resposta normal do POST.
        criado_em: { type: string, format: date-time }
        itens:
          type: array
          items: { $ref: '#/components/schemas/ItemDoPedido' }

    ItemDoPedido:
      type: object
      description: Snapshot imutável dos termos acordados (ADR-0003).
      required: [sku, quantidade, descricao, preco_unitario, moeda, unidade, peso_gramas, catalogo_versao]
      properties:
        sku: { type: string }
        quantidade: { type: number }
        descricao: { type: string }
        preco_unitario: { type: integer }
        moeda: { type: string }
        unidade: { type: string }
        peso_gramas: { type: integer }
        promocao_id: { type: [string, 'null'] }
        catalogo_versao: { type: string }

    Erro:
      type: object
      properties:
        detail:
          type: object
          properties:
            erro: { type: string }
            detalhe: { type: string }
