name: CI

# P2-09 — a prova e as fitness functions rodam a cada push.
# Build vermelho barra o merge.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  prova:
    name: Prova executável e fitness functions
    runs-on: ubuntu-latest

    services:
      postgres:
        # ADR-0005: Postgres, não SQLite. As escritas concorrentes precisam
        # competir de verdade para que o teste das 20 requisições tenha valor.
        image: postgres:18
        env:
          POSTGRES_USER: prova
          POSTGRES_PASSWORD: prova
          POSTGRES_DB: prova_pedidos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U prova"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PROVA_DATABASE_URL: postgresql://prova:prova@127.0.0.1:5432/prova_pedidos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: slice/requirements.txt

      - name: Instalar dependências
        run: python -m pip install -q -r slice/requirements.txt

      - name: Prova executável
        # Inclui os dois critérios críticos do §2.4.2:
        #  - 20 requisições concorrentes com a mesma chave -> 1 pedido
        #  - consumidor v1 não quebra com a v2 no ar
        working-directory: slice
        run: python -m pytest tests -v --tb=short -p no:cacheprovider

      - name: Conferência de consistência da entrega
        # Números citados nos documentos, links, referências a testes e
        # arquivos, cabeçalho canônico, codificação, formato das ADRs e
        # confidencialidade em todo o histórico.
        run: python tools/conferir-entrega.py

      - name: Resumo
        if: always()
        working-directory: slice
        run: |
          echo "### Prova executável" >> "$GITHUB_STEP_SUMMARY"
          python -m pytest tests -q -p no:cacheprovider 2>&1 | tail -3 >> "$GITHUB_STEP_SUMMARY" || true

  diagramas:
    name: Sintaxe dos diagramas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package.json

      - name: Instalar mermaid
        working-directory: tools
        run: npm install --no-fund --no-audit

      - name: Validar blocos Mermaid
        # Mermaid falha em silêncio: diagrama com erro não avisa, só não
        # aparece. Sem isto, E-02 cairia por um erro de sintaxe invisível.
        working-directory: tools
        run: node validar-mermaid.mjs

  confidencialidade:
    name: Varredura de confidencialidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Nenhum material de referência versionado
        run: |
          set -e
          falhou=0

          if git ls-files | grep -qE '^contexto/'; then
            echo "::error::pasta contexto/ versionada"; falhou=1
          fi
          if git ls-files | grep -qiE '\.pdf$'; then
            echo "::error::PDF versionado"; falhou=1
          fi
          if git ls-files | grep -qE '^(RETOMAR-AQUI|ROTEIRO-EXECUCAO|TESTE-MERMAID|diagramas\.html)'; then
            echo "::error::arquivo interno versionado"; falhou=1
          fi

          exit $falhou
